name: Build Test APK

on:
    workflow_dispatch:
    push:
        branches:
            - test-build

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-android:
        name: Build ARM64 Release APK
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  cache-read-only: false

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: 'platform-tools'

            - name: Install Ninja & ccache
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build ccache

            - name: Restore ccache
              uses: actions/cache@v4
              with:
                  path: /home/runner/.cache/ccache
                  key: ${{ runner.os }}-ccache-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-ccache-

            - name: Install dependencies
              run: npm ci

            - name: Generate native project
              run: npx expo prebuild --platform android --clean

            - name: Tune Gradle memory & packaging options
              run: |
                  echo "org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx1536m" >> android/gradle.properties
                  echo "org.gradle.workers.max=4" >> android/gradle.properties
                  echo "org.gradle.parallel=true" >> android/gradle.properties
                  echo "org.gradle.caching=true" >> android/gradle.properties
                  echo "org.gradle.vfs.watch=false" >> android/gradle.properties
                  echo "android.useFullClasspathForDexingTransform=true" >> android/gradle.properties
                  echo "android.enableR8.fullMode=true" >> android/gradle.properties
                  echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties
                  echo "android.lint.analysisPerComponent=false" >> android/gradle.properties
                  echo "android.experimental.lint.analysisPerComponent=false" >> android/gradle.properties
                  echo "android.packagingOptions.pickFirsts += ['**/libcrypto.so', '**/libssl.so', 'META-INF/*']" >> android/app/build.gradle
                  echo "android.packagingOptions.excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']" >> android/app/build.gradle
                  # Completely disable all lint tasks across all subprojects to save 6-8 minutes
                  cat << 'EOF' >> android/build.gradle

                  allprojects {
                      tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach {
                          enabled = false
                      }
                  }
                  EOF

            - name: Build Release APK
              working-directory: android
              env:
                  CCACHE_DIR: /home/runner/.cache/ccache
                  CCACHE_MAXSIZE: 2G
                  CMAKE_C_COMPILER_LAUNCHER: ccache
                  CMAKE_CXX_COMPILER_LAUNCHER: ccache
              run: ./gradlew assembleRelease --build-cache --parallel -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -PreactNativeArchitectures=arm64-v8a

            - name: Prepare APK Artifact
              run: |
                  mkdir -p build-artifacts
                  echo "=== Searching for generated APK files ==="
                  find android -name "*.apk"
                  find android -name "*.apk" -exec cp {} build-artifacts/ \;
                  echo "=== Content of build-artifacts ==="
                  ls -la build-artifacts/

            - name: Upload Release APK Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: kurmusic-arm64-release
                  path: build-artifacts/*.apk
                  retention-days: 30
                  if-no-files-found: error

            - name: Rename APK for preview download
              run: |
                  APK_FILE=$(find build-artifacts -name "*.apk" | head -n 1)
                  if [ -n "$APK_FILE" ]; then
                    cp "$APK_FILE" build-artifacts/kurmusic-test-preview.apk
                  fi

            - name: Publish Test Pre-release (No OTA)
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: test-build
                  name: KurMusic Test Preview (No OTA)
                  body: |
                      ### KurMusic Test Build (No OTA)
                      This is an experimental standalone test build for validating Glassmorphism, Settings as a Tab, Mini-Player swipe dismiss, and optimizations.

                      *Note: This is a pre-release and will NOT trigger in-app OTA notifications.*
                  files: build-artifacts/kurmusic-test-preview.apk
                  draft: false
                  prerelease: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-summary:
        name: Build Summary
        runs-on: ubuntu-latest
        needs: [build-android]
        if: always()
        steps:
            - name: Build Summary
              run: |
                  echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Artifact | Platform | Description |" >> $GITHUB_STEP_SUMMARY
                  echo "|----------|----------|-------------|" >> $GITHUB_STEP_SUMMARY
                  echo "| kurmusic-arm64-release | Android | ARM64 Lightweight Release APK |" >> $GITHUB_STEP_SUMMARY
